services:
  - type: web
    name: samaroh-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: firestore
      - key: ALLOW_STORAGE_FALLBACK
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: FIREBASE_PROJECT_ID
        value: samaroh-celebrations
      - key: ENABLE_AUTH_ENFORCEMENT
        value: "true"
      - key: ENABLE_APP_CHECK
        value: "true"
      - key: APP_CHECK_MODE
        value: monitor
      - key: APP_CHECK_DEV_BYPASS
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
