[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "samaroh-celebration-planner"
version = "1.0.0"
description = "GenAI Celebration & Event Planner for weddings, birthdays, and community festivals"
authors = [{ name = "Samaroh AI Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "google-generativeai>=0.8.0",
    "firebase-admin>=7.0.0",
    "google-cloud-firestore>=2.0.0",
    "mangum>=0.17.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "icalendar>=5.0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "C4"]
ignore = [
    "E501",
    "E402",
    "BLE001",
    "S110",
    "B008",
    "S101",
    "S105",
    "S106",
    "S314",
    "SIM105",
    "SIM102",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S314", "SLF001"]
"scripts/*" = ["S101", "S603", "S607", "S105", "S106", "S310"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
