name: Samaroh Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  commit-lint:
    name: Commit Message Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Conventional Commits on Head Commit
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Inspecting commit message:"
          echo "$MSG"
          python -c '
          import sys, re
          msg = """'"$MSG"'""".strip()
          subject = msg.splitlines()[0] if msg else ""
          pattern = r"^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|security|a11y)(\([a-z0-9_-]+\))?: .{1,72}$"
          if not re.match(pattern, subject):
              print(f"FAILED: Commit subject does not match Conventional Commits format: {subject}")
              sys.exit(1)
          print("PASSED: Valid Conventional Commit message.")
          '

  lint-and-typecheck:
    name: Ruff & Mypy Strict Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pydantic

      - name: Run Ruff Lint (Expanded Rules)
        run: |
          python -m ruff check .

      - name: Run Mypy Strict Audit
        run: |
          python -m mypy --strict src/

  test-suite:
    name: Pytest Unit & Integration Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov respx axe-core-python playwright

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Full Test Suite with Coverage Gate (>=80%)
        run: |
          python -m pytest --cov=src --cov-fail-under=80 -v
